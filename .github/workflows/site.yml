# Device-support site: regenerate docs/ from site/index.sqlite plus the
# verify reports filed as issues (label verify-report). Pages serves docs/.
name: site
on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency: site
jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'verify-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python site/reports.py
        env: {GITHUB_TOKEN: '${{ github.token }}'}
      - run: python site/coverage.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs site/reports.json
          git diff --cached --quiet || git commit -m "site: verify reports [skip ci]" && git push
