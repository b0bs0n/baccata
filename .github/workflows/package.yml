name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macOS
            args: --adhoc-sign
          - os: windows-latest
            target: windows
            args: ""
          - os: ubuntu-latest
            target: linux system
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run briefcase package ${{ matrix.target }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: baccata-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*.deb
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.deb
