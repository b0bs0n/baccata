name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: briefcase package macOS --adhoc-sign
          - os: windows-latest
            cmd: briefcase package windows -p zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ${{ matrix.cmd }}
      - name: Smoke-test the trimmed bundle (macOS)
        if: runner.os == 'macOS'
        run: uv run python -S .github/smoke.py build/baccata/macos/app/Baccata.app/Contents/Resources
      - name: Smoke-test the trimmed bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgs = (Get-ChildItem build -Recurse -Directory -Filter app_packages | Select-Object -First 1).Parent.FullName
          $py = (Get-ChildItem build -Recurse -Filter python.exe | Select-Object -First 1).FullName
          Write-Host "bundle: $pkgs  python: $py"
          & $py -S .github/smoke.py $pkgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: baccata-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip
