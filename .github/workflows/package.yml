name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: briefcase package macOS --adhoc-sign
            bundle: build/baccata/macos/app/Baccata.app/Contents/Resources
            python: python
          - os: windows-latest
            cmd: briefcase package windows -p zip
            bundle: build/baccata/windows/app/src
            python: build/baccata/windows/app/src/python/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ${{ matrix.cmd }}
      - name: Smoke-test the trimmed bundle
        run: uv run ${{ matrix.python }} -S .github/smoke.py ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: baccata-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.dmg
            dist/*.zip
