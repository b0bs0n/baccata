[project]
name = "baccata"
version = "0.1.1"
description = "KNX project editor and commissioning tool"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "PySide6-Essentials>=6.11.2",
    "PySide6-Addons>=6.11.2",       # QtMultimedia, for the QR camera scan
    "zxing-cpp>=3.1.1",
    "dukpy>=0.6.0",
]

[project.gui-scripts]
baccata = "baccata.editor:main"

[dependency-groups]
dev = [
    "briefcase>=0.4.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baccata"]

[tool.briefcase]
project_name = "Baccata"
bundle = "org.baccata"
version = "0.1.1"
url = "https://github.com/b0bs0n/baccata"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
author = "b0bs0n"
author_email = "96993735+b0bs0n@users.noreply.github.com"

[tool.briefcase.app.baccata]
formal_name = "Baccata"
description = "KNX project editor and commissioning tool"
long_description = """Baccata is an editor and commissioning tool for KNX
installations: edit projects, download parameters to devices, and manage
KNX Data Secure."""
sources = ["src/baccata"]
icon = "icons/baccata"                # baccata-<n>.png + .icns + .ico, private/tools/gen_icon.py

[tool.briefcase.app.baccata.macOS]
universal_build = false            # arm64 only; halves the bundle
min_os_version = "13.0"            # PySide6 6.11 ships macosx_13_0 wheels only
requires = ["std-nslog>=1.0.3"]
info."NSCameraUsageDescription" = "Scan the KNX Secure QR code on a device."
entitlement."com.apple.security.device.camera" = true

# Trim the PySide6 install to what Baccata imports (QtCore/Gui/Widgets +
# QtMultimedia for the QR camera scan).  Both lists come from
#   cd private && uv run python tools/gen_cleanup.py
